<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="30">
<title>{% block title %}Uptime Monitor{% endblock %}</title>
<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --text: #1d232b; --muted: #687482; --line: #e3e7ec;
  --up: #1f9d55; --down: #d64545; --stale: #c98a12; --nodata: #9aa5b1; --chart: #3b6fd8;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0f1318; --card: #171c23; --text: #e6eaef; --muted: #8b97a6; --line: #26303b;
          --up: #3ccf7e; --down: #ff6b6b; --stale: #f0b429; --nodata: #5f6b78; --chart: #6c9cff; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
       font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; }
h1 { font-size: 22px; margin: 0; } h2 { font-size: 17px; margin: 0 0 12px; }
a { color: inherit; } .muted { color: var(--muted); } .small { font-size: 13px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-top: 16px; }
.pills { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.pill { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 4px 12px; font-size: 13px; }
.badge { display: inline-block; min-width: 70px; text-align: center; border-radius: 6px; padding: 2px 8px;
         font-weight: 600; font-size: 12px; letter-spacing: .04em; color: #fff; }
.up { background: var(--up); } .down { background: var(--down); } .stale { background: var(--stale); } .no-data { background: var(--nodata); }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.bars { display: flex; gap: 2px; align-items: flex-end; height: 26px; }
.bars span { width: 6px; height: 100%; border-radius: 2px; }
.bars span.ok { background: var(--up); } .bars span.fail { background: var(--down); }
.url { font-size: 13px; color: var(--muted); word-break: break-all; }
.chart { width: 100%; height: auto; display: block; }
.chart polyline { fill: none; stroke: var(--chart); stroke-width: 2; }
.chart .grid { stroke: var(--line); } .chart .fail { stroke: var(--down); stroke-width: 3; }
.chart text { fill: var(--muted); font-size: 11px; }
.error { color: var(--down); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
.scroll { overflow-x: auto; }
footer { margin-top: 24px; font-size: 13px; color: var(--muted); }
</style>
</head>
<body><main>
{% block content %}{% endblock %}
<footer>
  Uptime Monitor {{ version }} · checks every {{ settings.interval_seconds }}s from a single location ·
  availability = successful checks / total checks · page refreshes every 30s ·
  <a href="/api/status">JSON</a>
</footer>
</main></body>
</html>
